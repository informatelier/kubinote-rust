name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kubi-kernel
        with:
          token: ${{ secrets.KUBICOMMONS_RUST_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      # O2-KR2: le soglie di latenza e cold start valgono solo con le ottimizzazioni.
      - run: cargo test --release -p kubirag-acceptance --test retrieval_engine -- --nocapture

  domain-purity:
    # O1-KR3: kubirag-domain e kubirag-app non dipendono da crate di I/O.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kubi-kernel
        with:
          token: ${{ secrets.KUBICOMMONS_RUST_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: nessun crate di I/O nel dominio e nei servizi applicativi
        run: |
          for crate in kubirag-domain kubirag-app; do
            tree=$(cargo tree -p "$crate" -e normal --prefix none)
            if echo "$tree" | grep -E '^(tokio|reqwest|ureq|hyper|axum|tantivy|rusqlite|windows-sys|dunce|tempfile) '; then
              echo "$crate dipende da un crate di I/O"; exit 1
            fi
            if cargo tree -p "$crate" -e features -i kubi-kernel | grep -q 'feature "fs"'; then
              echo "$crate attiva la feature fs di kubi-kernel"; exit 1
            fi
          done

  release:
    # O3-KR2: un binario per piattaforma, sotto i 50 MB senza voce.
    name: release (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest, binary: kubirag }
          - { target: linux-arm64, os: ubuntu-24.04-arm, binary: kubirag }
          - { target: macos-arm64, os: macos-latest, binary: kubirag }
          - { target: windows-x64, os: windows-latest, binary: kubirag.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kubi-kernel
        with:
          token: ${{ secrets.KUBICOMMONS_RUST_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p kubirag-cli
      - name: dimensione del binario
        shell: bash
        run: |
          size=$(wc -c < "target/release/${{ matrix.binary }}")
          echo "kubirag ${{ matrix.target }}: ${size} byte"
          echo "kubirag ${{ matrix.target }}: $((size / 1024 / 1024)) MB (${size} byte)" >> "$GITHUB_STEP_SUMMARY"
          test "$size" -lt $((50 * 1024 * 1024))
      - name: il binario parte e serve la SPA
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ws" && cd "$RUNNER_TEMP/ws"
          "$GITHUB_WORKSPACE/target/release/${{ matrix.binary }}" server --port 7171 &
          pid=$!
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:7171/governance && break; sleep 1; done
          curl -sf http://127.0.0.1:7171/ | grep -q '<div id="app">'
          kill "$pid"
      - uses: actions/upload-artifact@v4
        with:
          name: kubirag-${{ matrix.target }}
          path: target/release/${{ matrix.binary }}

  publish:
    # Un tag `v*` pubblica i binari della matrice `release` in una GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, release, docker, spa-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kubirag-*
      - name: archivi per piattaforma
        run: |
          mkdir dist
          for dir in kubirag-*; do
            if [ -f "$dir/kubirag.exe" ]; then
              (cd "$dir" && zip -q "../dist/$dir.zip" kubirag.exe)
            else
              chmod +x "$dir/kubirag"
              tar -czf "dist/$dir.tar.gz" -C "$dir" kubirag
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    # O3-KR3: immagine sotto i 100 MB.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kubi-kernel
        with:
          token: ${{ secrets.KUBICOMMONS_RUST_TOKEN }}
      - run: docker build -t kubirag:ci .
      - name: dimensione dell'immagine
        run: |
          size=$(docker image inspect kubirag:ci --format '{{.Size}}')
          echo "immagine kubirag: $((size / 1024 / 1024)) MB (${size} byte)" >> "$GITHUB_STEP_SUMMARY"
          test "$size" -lt $((100 * 1024 * 1024))
      - name: il container serve la SPA
        run: |
          docker run -d --name kubirag -p 7070:7070 kubirag:ci
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:7070/governance && break; sleep 1; done
          curl -sf http://127.0.0.1:7070/ | grep -q '<div id="app">'
          docker rm -f kubirag

  spa-smoke:
    # Criterio di uscita di F3: la SPA esistente funziona senza modifiche sul server Rust.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kubi-kernel
        with:
          token: ${{ secrets.KUBICOMMONS_RUST_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p kubirag-cli
      - name: Playwright con Chromium
        working-directory: contracts/tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: mkdir -p smoke && node contracts/tools/spa_smoke.mjs target/debug/kubirag smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spa-smoke
          path: smoke
          if-no-files-found: ignore
