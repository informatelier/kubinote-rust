name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # kubicommons-rust è privato: il GITHUB_TOKEN di questo repository non può leggerlo,
      # quindi serve il secret KUBICOMMONS_RUST_TOKEN (PAT fine-grained, Contents: read).
      - name: checkout di kubi-kernel (privato)
        uses: actions/checkout@v4
        with:
          repository: informatelier/kubicommons-rust
          ref: claude/f0-contracts-u5me88
          token: ${{ secrets.KUBICOMMONS_RUST_TOKEN }}
          path: .deps/kubicommons-rust
      - name: usa il checkout locale di kubi-kernel
        shell: bash
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'TOML'
          [patch."https://github.com/informatelier/kubicommons-rust"]
          kubi-kernel = { path = ".deps/kubicommons-rust/crates/kubi-kernel" }
          TOML
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  domain-purity:
    # O1-KR3: kubirag-domain non dipende da crate di I/O.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # kubicommons-rust è privato: il GITHUB_TOKEN di questo repository non può leggerlo,
      # quindi serve il secret KUBICOMMONS_RUST_TOKEN (PAT fine-grained, Contents: read).
      - name: checkout di kubi-kernel (privato)
        uses: actions/checkout@v4
        with:
          repository: informatelier/kubicommons-rust
          ref: claude/f0-contracts-u5me88
          token: ${{ secrets.KUBICOMMONS_RUST_TOKEN }}
          path: .deps/kubicommons-rust
      - name: usa il checkout locale di kubi-kernel
        shell: bash
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'TOML'
          [patch."https://github.com/informatelier/kubicommons-rust"]
          kubi-kernel = { path = ".deps/kubicommons-rust/crates/kubi-kernel" }
          TOML
      # kubicommons-rust è privato: il GITHUB_TOKEN di questo repository non può leggerlo,
      # quindi serve il secret KUBICOMMONS_RUST_TOKEN (PAT fine-grained, Contents: read).
      - name: checkout di kubi-kernel (privato)
        uses: actions/checkout@v4
        with:
          repository: informatelier/kubicommons-rust
          ref: claude/f0-contracts-u5me88
          token: ${{ secrets.KUBICOMMONS_RUST_TOKEN }}
          path: .deps/kubicommons-rust
      - name: usa il checkout locale di kubi-kernel
        shell: bash
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'TOML'
          [patch."https://github.com/informatelier/kubicommons-rust"]
          kubi-kernel = { path = ".deps/kubicommons-rust/crates/kubi-kernel" }
          TOML
      - uses: dtolnay/rust-toolchain@stable
      - name: nessun crate di I/O nel dominio
        run: |
          tree=$(cargo tree -p kubirag-domain -e normal --prefix none)
          if echo "$tree" | grep -E '^(tokio|reqwest|hyper|axum|tantivy|rusqlite|windows-sys) '; then
            echo "kubirag-domain dipende da un crate di I/O"; exit 1
          fi
          if cargo tree -p kubirag-domain -e features -i kubi-kernel | grep -q 'feature "fs"'; then
            echo "kubirag-domain attiva la feature fs di kubi-kernel"; exit 1
          fi
