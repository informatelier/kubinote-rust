<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubiRAG View</title>
    <script>
        try { document.documentElement.dataset.theme = localStorage.getItem('kubirag-theme') || 'dark'; }
        catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <link rel="stylesheet" href="/theme.css">
    <script src="marked-5-1-1.min.js"></script>
    <script src="mermaid-11-9-0.min.js"></script>
    <script src="/web/modules/wiki-links.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--c-bg);
            color: var(--c-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Header ────────────────────────────────────────────── */
        .mv-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: var(--c-surface);
            border-bottom: 1px solid var(--c-border);
            flex-shrink: 0;
        }
        .mv-title {
            flex: 1;
            font-size: 14px;
            font-weight: 500;
            color: var(--c-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mv-btn {
            padding: 4px 12px;
            border: 1px solid var(--c-border);
            border-radius: 6px;
            background: transparent;
            color: var(--c-text-dim);
            font-size: 12px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .mv-btn:hover {
            background: var(--c-surface-2);
            color: var(--c-text);
        }
        .mv-btn-close {
            border-color: #3d1f1f;
            color: var(--c-text-dim);
        }
        .mv-btn-close:hover {
            background: #3d1f1f;
            color: var(--c-danger);
        }

        /* ── Content area ───────────────────────────────────────── */
        .mv-body {
            flex: 1;
            overflow-y: auto;
            padding: 32px 20px;
        }
        .mv-content {
            max-width: 860px;
            margin: 0 auto;
            line-height: 1.8;
            font-size: 14px;
        }

        /* ── Loading / Error ────────────────────────────────────── */
        .mv-loading, .mv-error {
            text-align: center;
            padding: 60px 20px;
            color: var(--c-text-dim);
            font-size: 14px;
        }
        .mv-error { color: var(--c-danger); }

        /* ── Markdown elements ──────────────────────────────────── */
        .mv-content h1, .mv-content h2, .mv-content h3,
        .mv-content h4, .mv-content h5, .mv-content h6 {
            color: var(--c-text);
            margin: 20px 0 10px;
            line-height: 1.4;
        }
        .mv-content h1 { font-size: 24px; border-bottom: 1px solid var(--c-border); padding-bottom: 8px; }
        .mv-content h2 { font-size: 20px; border-bottom: 1px solid var(--c-surface-2); padding-bottom: 6px; }
        .mv-content h3 { font-size: 17px; }
        .mv-content h4 { font-size: 15px; }

        .mv-content p { margin-bottom: 12px; }
        .mv-content p:last-child { margin-bottom: 0; }

        .mv-content ul, .mv-content ol { margin: 8px 0 12px 24px; }
        .mv-content li { margin-bottom: 4px; }

        .mv-content strong { color: var(--c-text); }
        .mv-content em { color: var(--c-text); }

        .mv-content a { color: var(--c-accent); text-decoration: none; }
        .mv-content a:hover { text-decoration: underline; }
        /* [[wiki links]]: dashed + dimmed means "note not created yet, click to create it". */
        .kubi-wikilink { color: var(--c-accent); text-decoration: none; border-bottom: 1px solid var(--c-accent); }
        .kubi-wikilink--new { color: var(--c-text-dim); border-bottom: 1px dashed var(--c-border); opacity: 0.8; }
        .kubi-wikilink--new:hover { color: var(--c-accent); border-bottom-color: var(--c-accent); opacity: 1; }

        .mv-content img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            margin: 8px 0;
        }

        .mv-content code {
            background: var(--c-code-bg);
            color: var(--c-accent);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Fira Code', monospace;
            font-size: 12.5px;
        }
        .mv-content pre {
            background: var(--c-code-bg);
            border-left: 3px solid var(--c-accent);
            border-radius: 0 8px 8px 0;
            padding: 14px 16px;
            overflow-x: auto;
            margin: 12px 0;
        }
        .mv-content pre code {
            background: none;
            padding: 0;
            color: var(--c-code-text);
            font-size: 12px;
        }

        .mv-content blockquote {
            border-left: 3px solid var(--c-accent);
            margin: 12px 0;
            padding: 6px 14px;
            color: var(--c-text-dim);
            font-style: italic;
            background: rgba(99,102,241,0.05);
            border-radius: 0 6px 6px 0;
        }

        .mv-backlinks {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid var(--c-border);
        }
        .mv-backlinks h2 {
            font-size: 16px;
            margin-bottom: 10px;
        }
        .mv-backlinks li {
            margin-bottom: 8px;
        }
        /* Backlink names were <strong> before they became links — keep the same weight. */
        .mv-backlinks .kubi-wikilink { font-weight: 600; }
        .mv-backlinks small {
            display: block;
            color: var(--c-text-dim);
            margin-top: 2px;
        }

        .mv-content hr {
            border: none;
            border-top: 1px solid var(--c-border);
            margin: 20px 0;
        }

        .mv-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0;
            font-size: 13px;
        }
        .mv-content th, .mv-content td {
            border: 1px solid var(--c-border);
            padding: 7px 12px;
            text-align: left;
        }
        .mv-content th {
            background: var(--c-surface);
            color: var(--c-text);
            font-weight: 600;
        }
        .mv-content tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

        /* ── Mermaid ────────────────────────────────────────────── */
        .mv-mermaid-placeholder {
            padding: 16px;
            color: var(--c-text-dim);
            font-size: 12px;
            text-align: center;
        }
        .mv-mermaid-rendered {
            margin: 16px 0;
            display: flex;
            justify-content: center;
        }
        .mv-mermaid-container {
            position: relative;
            display: inline-block;
            background: #ffffff;
            border-radius: 8px;
            padding: 16px;
            max-width: 100%;
        }
        .mv-mermaid-container svg {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .mv-mermaid-popup-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 10px;
            border: none;
            border-radius: 5px;
            background: rgba(99, 102, 241, 0.85);
            color: white;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .mv-mermaid-container:hover .mv-mermaid-popup-btn { opacity: 1; }
        .mv-mermaid-error {
            color: var(--c-danger);
            padding: 8px 12px;
            border: 1px solid var(--c-danger);
            border-radius: 6px;
            font-size: 12px;
            margin: 8px 0;
        }
    </style>
</head>
<body>

    <div class="mv-header">
        <span class="mv-title" id="mvTitle">📄 Caricamento...</span>
        <button class="mv-btn" onclick="window.location.reload()" title="Ricarica">↺ Ricarica</button>
        <button class="mv-btn mv-btn-close" onclick="window.close()">✕ Chiudi</button>
    </div>

    <div class="mv-body">
        <div class="mv-content" id="mvContent">
            <div class="mv-loading">⏳ Caricamento contenuto...</div>
        </div>
    </div>

    <script>
        function cssVar(name, fallback) {
            const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
            return v || fallback;
        }

        function mermaidThemeVars() {
            const accent = cssVar('--c-accent', '#38bdf8');
            return {
                primaryColor: accent,
                primaryTextColor: '#333',
                primaryBorderColor: accent,
                lineColor: accent,
            };
        }

        mermaid.initialize({
            startOnLoad: false,
            theme: 'neutral',
            securityLevel: 'loose',
            themeVariables: mermaidThemeVars()
        });

        const params = new URLSearchParams(window.location.search);
        const noteParam = params.get('note');
        const docParam  = params.get('doc');

        // Diagram sources for per-diagram popup
        const diagramSources = new Map();

        // Note names that exist in the store — drives the resolved/unresolved styling of [[ ]].
        let knownNotes = [];

        async function loadContent() {
            const content = document.getElementById('mvContent');
            try {
                let text = '';
                let title = '';
                let loadedNoteRef = null;

                knownNotes = await window.KubiWikiLinks.loadNotes();

                if (noteParam) {
                    const noteRef = window.KubiWikiLinks.cleanRef(noteParam);
                    const noteName = noteRef.split('/').pop();
                    const notePath = noteRef + '.md';
                    const pathQuery = noteRef.includes('/') ? `?path=${encodeURIComponent(notePath)}` : '';
                    const res = await fetch(`/notes/${encodeURIComponent(noteName)}${pathQuery}`);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    text  = data.content || '';
                    loadedNoteRef = data.ref || noteRef;
                    title = loadedNoteRef + '.md';
                } else if (docParam) {
                    const res = await fetch(`/documents/${encodeURIComponent(docParam)}`);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    text  = data.content || '';
                    title = data.filename || data.metadata?.filename || docParam;
                } else {
                    content.innerHTML = '<div class="mv-error">⚠️ Nessun parametro <code>?note=</code> o <code>?doc=</code> nell\'URL.</div>';
                    return;
                }

                document.getElementById('mvTitle').textContent = '📄 ' + title;
                document.title = title + ' — KubiRAG View';

                await renderContent(text, content, {
                    note: loadedNoteRef ? loadedNoteRef.split('/').pop() : null,
                    noteRef: loadedNoteRef,
                    notePath: loadedNoteRef ? loadedNoteRef + '.md' : null,
                    doc: docParam, title
                });

            } catch (e) {
                content.innerHTML = `<div class="mv-error">❌ Errore caricamento: ${e.message}</div>`;
            }
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function preprocessObsidianMarkdown(text, context = {}) {
            // Standalone page: emit real hrefs and let the browser navigate — an existing note
            // opens here, a missing one lands on the editor prefilled to create it.
            return window.KubiWikiLinks.preprocess(text, context, {
                notes: knownNotes,
                sourceRef: context.noteRef || context.note,
                href: (target, resolved) => resolved
                    ? `/markview?note=${encodeURIComponent(target)}`
                    : window.KubiWikiLinks.newNoteHref(target)
            });
        }

        async function loadBacklinks(context = {}) {
            const noteName = context.note || (context.title || '').replace(/\.md$/i, '');
            if (!noteName) return [];
            const urls = context.note
                ? [`/notes/${encodeURIComponent(noteName)}/relations${context.notePath ? `?path=${encodeURIComponent(context.notePath)}` : ''}`]
                : [`/notes/relations/${encodeURIComponent(noteName)}`];
            for (const url of urls) {
                try {
                    const res = await fetch(url);
                    if (!res.ok) continue;
                    const data = await res.json();
                    return data.backlinks || [];
                } catch (e) {
                    return [];
                }
            }
            return [];
        }

        function backlinksHtml(backlinks) {
            if (!backlinks || backlinks.length === 0) return '';
            // A backlink was found by walking real files, so its note always exists.
            const rows = backlinks.map(link => `
                <li>
                    ${window.KubiWikiLinks.anchor(link.noteRef || link.noteName, link.noteName, {
                        href: `/markview?note=${encodeURIComponent(link.noteRef || link.noteName)}`,
                        title: link.snippet || link.path || link.noteName
                    })}
                    <small>${escapeHtml(link.snippet || link.path || '')}</small>
                </li>`).join('');
            return `<section class="mv-backlinks"><h2>Backlink</h2><ul>${rows}</ul></section>`;
        }

        async function renderContent(text, container, context = {}) {
            diagramSources.clear();
            let counter = 0;
            const diagrams = new Map();
            const obsidianText = preprocessObsidianMarkdown(text, context);

            // Extract mermaid blocks before marked.parse
            const processed = obsidianText.replace(/```mermaid\n([\s\S]*?)\n```/g, (match, diagram) => {
                const id = `mv-mermaid-${counter++}`;
                const src = diagram.trim();
                diagrams.set(id, src);
                return `<div id="${id}" class="mv-mermaid-placeholder">📊 Caricamento diagramma...</div>`;
            });

            container.innerHTML = marked.parse(processed);
            container.insertAdjacentHTML('beforeend', backlinksHtml(await loadBacklinks(context)));

            // Render mermaid diagrams async
            for (const [id, diagram] of diagrams) {
                const ph = document.getElementById(id);
                if (!ph || !diagram) continue;
                try {
                    const renderId = `mvrender-${id}-${Date.now()}`;
                    const { svg } = await mermaid.render(renderId, diagram);
                    diagramSources.set(id, diagram);
                    ph.innerHTML = `
                        <div class="mv-mermaid-container">
                            ${svg}
                            <button class="mv-mermaid-popup-btn"
                                onclick="openDiagramPopup('${id}')"
                                title="Apri a schermo intero">🔍 Apri</button>
                        </div>`;
                    ph.className = 'mv-mermaid-rendered';
                } catch (e) {
                    ph.innerHTML = `<div class="mv-mermaid-error">❌ Errore diagramma: <code>${e.message || 'Unknown'}</code></div>`;
                    ph.className = '';
                }
            }

            // Render KaTeX math
            if (window.renderMathInElement) {
                renderMathInElement(container, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true  },
                        { left: '$',  right: '$',  display: false },
                        { left: '\\(', right: '\\)', display: false },
                        { left: '\\[', right: '\\]', display: true  }
                    ],
                    throwOnError: false
                });
            }
        }

        function openDiagramPopup(id) {
            const source = diagramSources.get(id);
            if (!source) return;
            const popup = window.open('', '_blank', 'width=1100,height=750,scrollbars=yes,resizable=yes');
            if (!popup) return;
            const escaped = source.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            popup.document.write(`<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Diagramma</title>
    <script src="/mermaid-11-9-0.min.js"><\/script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #12121f; display: flex; flex-direction: column; height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .toolbar { display: flex; gap: 8px; padding: 10px 16px; background: #1e1e2e; border-bottom: 1px solid #333; align-items: center; }
        .toolbar-title { color: var(--c-text); font-weight: 600; font-size: 14px; flex: 1; }
        .btn { padding: 5px 14px; border: none; border-radius: 6px; background: var(--c-accent); color: white; cursor: pointer; font-size: 12px; font-weight: 500; }
        .btn:hover { background: #5254cc; }
        .btn-close { background: #3d3d4e; }
        .btn-close:hover { background: #555; }
        .diagram-wrap { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 24px; }
        .mermaid { background: beige; border-radius: 10px; padding: 20px; display: inline-block; width:100%; }
        .source-block { display: none; padding: 0 16px 16px; }
        .source-block.show { display: block; }
        .source-block pre { background: #1e1e2e; color: var(--c-code-text); font-family: monospace; font-size: 12px;
            padding: 12px; border-radius: 8px; white-space: pre-wrap; border-left: 3px solid var(--c-accent);
            max-height: 180px; overflow: auto; }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="toolbar-title">📊 Diagramma</span>
        <button class="btn" onclick="downloadSVG()">💾 SVG</button>
        <button class="btn" onclick="downloadPNG()">🖼️ PNG</button>
        <button class="btn" id="btnSrc" onclick="toggleSrc()">📄 Sorgente</button>
        <button class="btn btn-close" onclick="window.close()">✕ Chiudi</button>
    </div>
    <div class="diagram-wrap">
        <div id="diagram" class="mermaid"></div>
    </div>
    <div class="source-block" id="srcBlock"><pre>${escaped}</pre></div>
    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });
        mermaid.render('popup-diagram', ${JSON.stringify(source)}).then(({ svg }) => {
            document.getElementById('diagram').innerHTML = svg;
        });
        function downloadSVG() {
            const svg = document.querySelector('#diagram svg');
            if (!svg) return;
            const blob = new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' });
            const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'diagram.svg' });
            a.click(); URL.revokeObjectURL(a.href);
        }
        function downloadPNG() {
            const svg = document.querySelector('#diagram svg');
            if (!svg) return;
            const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml;charset=utf-8' }));
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width; canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'white'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                canvas.toBlob(b => {
                    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(b), download: 'diagram.png' });
                    a.click(); URL.revokeObjectURL(a.href);
                });
                URL.revokeObjectURL(url);
            };
            img.src = url;
        }
        function toggleSrc() {
            const block = document.getElementById('srcBlock');
            const btn = document.getElementById('btnSrc');
            const show = block.classList.toggle('show');
            btn.textContent = show ? '📄 Nascondi' : '📄 Sorgente';
        }
    <\/script>
</body>
</html>`);
            popup.document.close();
        }

        loadContent();
    </script>
</body>
</html>
