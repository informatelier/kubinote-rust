<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KubiRAG</title>
    <script>
        try { document.documentElement.dataset.theme = localStorage.getItem('kubirag-theme') || 'dark'; }
        catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/web/ragboard.css">
    <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
    <!-- Classic script: shared with markview/markboard, which have no module loader. -->
    <script src="/web/modules/wiki-links.js"></script>
    <script type="importmap">
        {
            "imports": {
                "vue": "https://esm.sh/vue@3.5.13/dist/vue.esm-bundler.js"
            }
        }
    </script>
</head>
<body>
    <div id="app"></div>
    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });
    </script>
    <script type="module" src="/web/app.js"></script>
</body>
</html>
