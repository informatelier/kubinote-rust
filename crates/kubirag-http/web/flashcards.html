<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards — KubiRAG</title>
    <script>
        try { document.documentElement.dataset.theme = localStorage.getItem('kubirag-theme') || 'dark'; }
        catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <link rel="stylesheet" href="/theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Local names mapped onto shared theme tokens (see /theme.css),
           same convention as the Think tool. */
        :root {
            --accent: var(--c-accent);
            --text-primary: var(--c-text);
            --text-secondary: var(--c-text-dim);
            --success: var(--c-success);
            --danger: var(--c-danger);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--c-bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Top bar: Back / name / Save */
        .topbar {
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .topbar .spacer { flex: 1; }

        .topbar-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--c-glass-border);
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            background: var(--c-glass-bg);
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .topbar-btn:hover { border-color: var(--accent); }
        .topbar-btn.save { background: var(--accent); color: var(--c-accent-contrast); border-color: var(--accent); }
        .topbar-btn.save:hover { filter: brightness(1.1); }

        .deck-name-input,
        .quiz-name-input {
            padding: 0.5rem 0.75rem;
            background: var(--c-input-bg);
            border: 1px solid var(--c-glass-border);
            border-radius: 0.5rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            min-width: 220px;
        }

        .deck-name-input:focus,
        .quiz-name-input:focus { outline: none; border-color: var(--accent); }

        .deck-name-label,
        .quiz-name-label {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
        }

        .topbar-status {
            color: var(--text-secondary);
            font-size: 12px;
            min-width: 80px;
        }

        /* Main panel — same glass panel as Think */
        .container {
            background: var(--c-glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--c-glass-border);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 800px;
            min-height: 500px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--c-border);
        }

        .nav-tab {
            padding: 10px 18px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            cursor: pointer;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .nav-tab:hover { color: var(--text-primary); }

        .nav-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Forms */
        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        input,
        textarea,
        select {
            font-family: inherit;
            color: var(--text-primary);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            background: var(--c-input-bg);
            border: 1px solid var(--c-glass-border);
            border-radius: 0.5rem;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        ::placeholder { color: var(--text-secondary); opacity: 1; }

        select option { background: var(--c-surface); color: var(--text-primary); }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* Buttons — aligned with Think (.btn-primary = accent, others token-based) */
        .btn {
            padding: 0.5rem 1rem;
            border: 1px solid transparent;
            border-radius: 0.5rem;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

        .btn-primary { background: var(--accent); color: var(--c-accent-contrast); }
        .btn-primary:hover:not(:disabled) { filter: brightness(1.1); }

        .btn-secondary {
            background: transparent;
            color: var(--accent);
            border-color: var(--accent);
        }
        .btn-secondary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 12%, transparent); }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border-color: var(--danger);
        }
        .btn-danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 14%, transparent); }

        .btn-success { background: var(--success); color: var(--c-bg); }
        .btn-success:hover:not(:disabled) { filter: brightness(1.1); }

        /* Item lists (manage tab) */
        .card-list {
            max-height: 460px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .card-item {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: 0.75rem;
            padding: 15px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }

        .card-item:hover { border-color: var(--accent); }

        .card-preview {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-text { flex: 1; margin-right: 15px; }

        .card-actions { display: flex; gap: 10px; }

        .card-meta {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Statistics */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            padding: 20px;
            border-radius: 0.75rem;
            text-align: center;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .no-cards {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
            font-style: italic;
        }

        /* Info banner (study progress / quiz progress / results) */
        .study-info,
        .quiz-info {
            background: var(--c-surface-2);
            border: 1px solid var(--c-border);
            border-radius: 0.75rem;
            padding: 16px 20px;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .study-info { text-align: center; }
        .study-info h2 { margin-bottom: 8px; }
        .study-info p { color: var(--text-secondary); margin-bottom: 14px; }

        /* Toast notifications (created in JS, colors via tokens) */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 18px;
            border-radius: 0.5rem;
            color: var(--c-bg);
            font-weight: 600;
            z-index: 1000;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
            animation: slideIn 0.3s ease;
        }
        .notification.success { background: var(--success); }
        .notification.error   { background: var(--danger); }
        .notification.info    { background: var(--accent); color: var(--c-accent-contrast); }

        /* Flashcard */
        .flashcard {
            width: 100%;
            height: 300px;
            perspective: 1000px;
            margin-bottom: 20px;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }

        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: var(--c-surface);
            border: 2px solid var(--accent);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .flashcard-back {
            background: var(--c-surface-2);
            border-color: var(--c-border);
            transform: rotateY(180deg);
        }

        .flashcard-content {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-primary);
            word-wrap: break-word;
        }

        .difficulty-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .difficulty-btn {
            padding: 0.5rem 1.25rem;
            border: 1px solid transparent;
            border-radius: 999px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s;
            min-width: 120px;
        }

        .difficulty-btn:hover { filter: brightness(1.1); }

        .difficulty-easy   { background: var(--success); color: var(--c-bg); }
        .difficulty-medium { background: var(--c-surface-2); color: var(--text-primary); border-color: var(--c-border); }
        .difficulty-hard   { background: var(--danger); color: var(--c-bg); }

        .card-front-preview {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .card-back-preview {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .next-review {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .nav-tabs { flex-wrap: wrap; }
            .difficulty-buttons { flex-direction: column; align-items: center; }
            .card-actions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <button class="topbar-btn" onclick="goBack()">← Back</button>
        <span id="deck-name-label" class="deck-name-label" style="display:none;"></span>
        <input id="deck-name-input" class="deck-name-input" type="text" placeholder="Deck name…" style="display:none;">
        <span class="spacer"></span>
        <span id="save-status" class="topbar-status"></span>
        <button id="save-btn" class="topbar-btn save" onclick="saveDeck()">💾 Save</button>
    </div>

    <div class="container">
        <nav class="nav-tabs">
            <button class="nav-tab active" data-tab="editor">Create Cards</button>
            <button class="nav-tab" data-tab="study">Study</button>
            <button class="nav-tab" data-tab="manage">Manage Cards</button>
            <button class="nav-tab" data-tab="stats">Statistics</button>
        </nav>

        <!-- Editor Tab -->
        <div class="tab-content active" id="editor">
            <form id="flashcard-form">
                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" placeholder="e.g., Spanish, Math, History" required>
                </div>

                <div class="form-group">
                    <label for="front">Question/Front</label>
                    <textarea id="front" placeholder="Enter the question or front of the card" required></textarea>
                </div>

                <div class="form-group">
                    <label for="back">Answer/Back</label>
                    <textarea id="back" placeholder="Enter the answer or back of the card" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Add Flashcard</button>
            </form>
        </div>

        <!-- Study Tab -->
        <div class="tab-content" id="study">
            <div class="study-container">
                <div id="no-study-cards" class="no-cards">
                    No cards available for study right now.<br>
                    Create some cards or check back later!
                </div>

                <div id="study-area" style="display: none;">
                    <div class="study-info">
                        <div id="study-progress">Card 1 of 5</div>
                        <div class="next-review" id="card-info"></div>
                    </div>

                    <div class="flashcard" id="current-flashcard">
                        <div class="flashcard-inner">
                            <div class="flashcard-front">
                                <div class="flashcard-content" id="card-front"></div>
                            </div>
                            <div class="flashcard-back">
                                <div class="flashcard-content" id="card-back"></div>
                            </div>
                        </div>
                    </div>

                    <div id="flip-prompt" style="text-align: center; margin-bottom: 20px;">
                        <button class="btn btn-secondary" onclick="flipCard()">Show Answer</button>
                    </div>

                    <div class="difficulty-buttons" id="difficulty-buttons" style="display: none;">
                        <button class="difficulty-btn difficulty-hard" onclick="rateDifficulty('hard')">
                            Hard (1 day)
                        </button>
                        <button class="difficulty-btn difficulty-medium" onclick="rateDifficulty('medium')">
                            Medium (3 days)
                        </button>
                        <button class="difficulty-btn difficulty-easy" onclick="rateDifficulty('easy')">
                            Easy (7 days)
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Manage Tab -->
        <div class="tab-content" id="manage">
            <div class="form-group">
                <label for="filter-category">Filter by Category</label>
                <select id="filter-category">
                    <option value="">All Categories</option>
                </select>
            </div>

            <div class="card-list" id="card-list">
                <div class="no-cards">No flashcards created yet.</div>
            </div>
        </div>

        <!-- Stats Tab -->
        <div class="tab-content" id="stats">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="total-cards">0</div>
                    <div class="stat-label">Total Cards</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="cards-due">0</div>
                    <div class="stat-label">Due Today</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="studied-today">0</div>
                    <div class="stat-label">Studied Today</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="streak">0</div>
                    <div class="stat-label">Day Streak</div>
                </div>
            </div>

            <div class="form-group">
                <button class="btn btn-danger" onclick="resetAllProgress()">Reset All Progress</button>
            </div>
        </div>
    </div>

    <script>
        // ── URL parameters & note-file integration ────────────────────────
        const _urlParams = new URLSearchParams(window.location.search);
        const NOTE_PARAM = _urlParams.get('note');           // null | '__new__' | '<name>'
        const PLAY_MODE  = _urlParams.get('mode') === 'play';
        const isNewDeck  = !NOTE_PARAM || NOTE_PARAM === '__new__';
        let currentNoteName = isNewDeck ? null : NOTE_PARAM;
        let currentArtifactRevision = null;
        const artifactContentUrl = ref => `/artifacts/content?ref=${encodeURIComponent(ref)}`;

        function goBack() { window.location.href = '/'; }

        function showStatus(msg) {
            const el = document.getElementById('save-status');
            el.textContent = msg;
            if (msg) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 2500);
        }

        // Serialize the deck to the markdown note format:
        //   frontmatter `kubi-type: flashcards` + a fenced ```flashcards JSON block.
        function buildNoteMarkdown() {
            const payload = {
                version: 1,
                studyStats: flashcardSystem.studyStats,
                cards: flashcardSystem.cards
            };
            return '---\nkubi-type: flashcards\n---\n\n'
                + '```flashcards\n'
                + JSON.stringify(payload, null, 2) + '\n'
                + '```\n';
        }

        // Extract the JSON payload from a deck note's markdown content.
        function parseNoteMarkdown(content) {
            // Greedy to the last fence so card bodies containing backticks don't truncate it.
            const m = content.match(/```flashcards\s*\n([\s\S]*)\n```/);
            if (!m) return null;
            try { return JSON.parse(m[1]); } catch (e) { return null; }
        }

        // ── Flashcard data structure ──────────────────────────────────────
        class FlashcardSystem {
            constructor() {
                this.cards = [];
                this.studyStats = { studiedToday: 0, lastStudyDate: null, streak: 0 };
                this.currentStudyCards = [];
                this.currentCardIndex = 0;
                this.isCardFlipped = false;
            }

            // Persist to the backing note. Only auto-saves once the deck has a name
            // (a brand-new unsaved deck keeps its state in memory until the first Save).
            persist() {
                if (!currentNoteName) return;
                fetch(artifactContentUrl(currentNoteName), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: buildNoteMarkdown(), expectedRevision: currentArtifactRevision })
                }).then(res => {
                    if (!res.ok) { showStatus(res.status === 409 ? 'Save conflict' : 'Save failed'); return null; }
                    return res.json();
                }).then(data => {
                    if (data) { currentArtifactRevision = data.revision; showStatus('Saved ✓'); }
                }).catch(e => showStatus('Save error'));
            }

            addCard(category, front, back) {
                const card = {
                    id: Date.now() + Math.random(),
                    category: category.trim(),
                    front: front.trim(),
                    back: back.trim(),
                    createdAt: new Date(),
                    nextReview: new Date(),
                    interval: 1,
                    easeFactor: 2.5,
                    reviewCount: 0,
                    correctCount: 0
                };

                this.cards.push(card);
                this.persist();
                return card;
            }

            deleteCard(cardId) {
                this.cards = this.cards.filter(card => card.id !== cardId);
                this.persist();
            }

            updateCard(cardId, updates) {
                const cardIndex = this.cards.findIndex(card => card.id === cardId);
                if (cardIndex !== -1) {
                    this.cards[cardIndex] = { ...this.cards[cardIndex], ...updates };
                    this.persist();
                }
            }

            getCardsForReview() {
                const now = new Date();
                return this.cards.filter(card => new Date(card.nextReview) <= now);
            }

            getCategories() {
                const categories = [...new Set(this.cards.map(card => card.category))];
                return categories.sort();
            }

            calculateNextReview(card, difficulty) {
                const now = new Date();
                let interval = card.interval;
                let easeFactor = card.easeFactor;

                // Spaced repetition algorithm (simplified SM-2)
                switch (difficulty) {
                    case 'hard':
                        interval = Math.max(1, Math.floor(interval * 0.6));
                        easeFactor = Math.max(1.3, easeFactor - 0.2);
                        break;
                    case 'medium':
                        interval = Math.max(1, interval);
                        easeFactor = Math.max(1.3, easeFactor - 0.1);
                        break;
                    case 'easy':
                        interval = Math.ceil(interval * easeFactor);
                        easeFactor = easeFactor + 0.1;
                        break;
                }

                const nextReview = new Date(now.getTime() + interval * 24 * 60 * 60 * 1000);

                return {
                    nextReview,
                    interval,
                    easeFactor,
                    reviewCount: card.reviewCount + 1,
                    correctCount: difficulty === 'hard' ? card.correctCount : card.correctCount + 1
                };
            }

            updateStats() {
                const today = new Date().toDateString();
                const lastStudy = this.studyStats.lastStudyDate;

                if (lastStudy !== today) {
                    if (lastStudy === new Date(Date.now() - 24 * 60 * 60 * 1000).toDateString()) {
                        this.studyStats.streak += 1;
                    } else if (lastStudy) {
                        this.studyStats.streak = 1;
                    } else {
                        this.studyStats.streak = 1;
                    }
                    this.studyStats.studiedToday = 0;
                    this.studyStats.lastStudyDate = today;
                }

                this.studyStats.studiedToday += 1;
                this.persist();
            }
        }

        // Initialize the system
        const flashcardSystem = new FlashcardSystem();

        // Tab navigation
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const targetTab = tab.dataset.tab;
                switchTab(targetTab);
            });
        });

        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            const tabBtn = document.querySelector(`[data-tab="${tabName}"]`);
            if (tabBtn) tabBtn.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');

            // Refresh content based on tab
            switch (tabName) {
                case 'study':
                    initializeStudySession();
                    break;
                case 'manage':
                    refreshManageTab();
                    break;
                case 'stats':
                    refreshStats();
                    break;
            }
        }

        // Form submission
        document.getElementById('flashcard-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const category = document.getElementById('category').value;
            const front = document.getElementById('front').value;
            const back = document.getElementById('back').value;

            flashcardSystem.addCard(category, front, back);

            // Clear form
            document.getElementById('flashcard-form').reset();

            // Show success feedback
            showNotification('Flashcard added successfully!', 'success');
        });

        // Study functionality
        function initializeStudySession() {
            flashcardSystem.currentStudyCards = flashcardSystem.getCardsForReview();
            flashcardSystem.currentCardIndex = 0;
            flashcardSystem.isCardFlipped = false;

            if (flashcardSystem.currentStudyCards.length === 0) {
                document.getElementById('no-study-cards').style.display = 'block';
                document.getElementById('study-area').style.display = 'none';
            } else {
                document.getElementById('no-study-cards').style.display = 'none';
                document.getElementById('study-area').style.display = 'block';
                showCurrentCard();
            }
        }

        function showCurrentCard() {
            if (flashcardSystem.currentCardIndex >= flashcardSystem.currentStudyCards.length) {
                showStudyComplete();
                return;
            }

            const card = flashcardSystem.currentStudyCards[flashcardSystem.currentCardIndex];
            const progress = `Card ${flashcardSystem.currentCardIndex + 1} of ${flashcardSystem.currentStudyCards.length}`;

            document.getElementById('study-progress').textContent = progress;
            document.getElementById('card-info').textContent = `Category: ${card.category}`;
            document.getElementById('card-front').textContent = card.front;
            document.getElementById('card-back').textContent = card.back;

            // Reset card state
            document.getElementById('current-flashcard').classList.remove('flipped');
            document.getElementById('flip-prompt').style.display = 'block';
            document.getElementById('difficulty-buttons').style.display = 'none';
            flashcardSystem.isCardFlipped = false;
        }

        function flipCard() {
            document.getElementById('current-flashcard').classList.add('flipped');
            document.getElementById('flip-prompt').style.display = 'none';
            document.getElementById('difficulty-buttons').style.display = 'flex';
            flashcardSystem.isCardFlipped = true;
        }

        function rateDifficulty(difficulty) {
            const card = flashcardSystem.currentStudyCards[flashcardSystem.currentCardIndex];
            const updates = flashcardSystem.calculateNextReview(card, difficulty);

            flashcardSystem.updateCard(card.id, updates);
            flashcardSystem.updateStats();

            flashcardSystem.currentCardIndex++;
            showCurrentCard();
        }

        function showStudyComplete() {
            document.getElementById('study-area').innerHTML = `
                <div class="study-info">
                    <h2>Study Session Complete!</h2>
                    <p>Great job! You've reviewed all available cards.</p>
                    <button class="btn btn-primary" onclick="switchTab('stats')">View Statistics</button>
                </div>
            `;
        }

        // Manage tab functionality
        function refreshManageTab() {
            updateCategoryFilter();
            displayCards();
        }

        function updateCategoryFilter() {
            const categorySelect = document.getElementById('filter-category');
            const categories = flashcardSystem.getCategories();

            categorySelect.innerHTML = '<option value="">All Categories</option>';
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categorySelect.appendChild(option);
            });
        }

        function displayCards(filterCategory = '') {
            const cardList = document.getElementById('card-list');
            let cards = flashcardSystem.cards;

            if (filterCategory) {
                cards = cards.filter(card => card.category === filterCategory);
            }

            if (cards.length === 0) {
                cardList.innerHTML = '<div class="no-cards">No flashcards match your filter.</div>';
                return;
            }

            cardList.innerHTML = cards.map(card => `
                <div class="card-item">
                    <div class="card-preview">
                        <div class="card-text">
                            <div class="card-front-preview">${escapeHtml(card.front)}</div>
                            <div class="card-back-preview">${escapeHtml(card.back)}</div>
                        </div>
                        <div class="card-actions">
                            <button class="btn btn-danger" onclick="deleteFlashcard(${card.id})">Delete</button>
                        </div>
                    </div>
                    <div class="card-meta">
                        <span>Category: ${escapeHtml(card.category)}</span>
                        <span>Reviews: ${card.reviewCount}</span>
                        <span>Next Review: ${new Date(card.nextReview).toLocaleDateString()}</span>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function deleteFlashcard(cardId) {
            if (confirm('Are you sure you want to delete this flashcard?')) {
                flashcardSystem.deleteCard(cardId);
                displayCards();
                showNotification('Flashcard deleted successfully!', 'success');
            }
        }

        // Filter cards by category
        document.getElementById('filter-category').addEventListener('change', (e) => {
            displayCards(e.target.value);
        });

        // Statistics functionality
        function refreshStats() {
            const totalCards = flashcardSystem.cards.length;
            const cardsDue = flashcardSystem.getCardsForReview().length;
            const studiedToday = flashcardSystem.studyStats.studiedToday;
            const streak = flashcardSystem.studyStats.streak;

            document.getElementById('total-cards').textContent = totalCards;
            document.getElementById('cards-due').textContent = cardsDue;
            document.getElementById('studied-today').textContent = studiedToday;
            document.getElementById('streak').textContent = streak;
        }

        // Utility functions
        function resetAllProgress() {
            if (confirm('Reset ALL spaced-repetition progress for this deck? This cannot be undone.')) {
                flashcardSystem.cards.forEach(card => {
                    card.interval = 1;
                    card.easeFactor = 2.5;
                    card.reviewCount = 0;
                    card.correctCount = 0;
                    card.nextReview = new Date();
                });
                flashcardSystem.studyStats = { studiedToday: 0, lastStudyDate: null, streak: 0 };
                flashcardSystem.persist();
                refreshStats();
                showNotification('Progress reset.', 'success');
            }
        }

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => document.body.removeChild(notification), 300);
            }, 3000);
        }

        // Add CSS for notifications
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // ── Save (explicit button) ────────────────────────────────────────
        async function saveDeck() {
            if (currentNoteName) {
                flashcardSystem.persist();
                return;
            }
            // New deck: needs a name, then create via POST and switch to PUT mode.
            const raw = document.getElementById('deck-name-input').value.trim();
            if (!raw) { showStatus('Enter a deck name'); document.getElementById('deck-name-input').focus(); return; }
            const name = raw.replace(/[^\w\-./ ]/g, '_');
            try {
                const res = await fetch('/artifacts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, type: 'flashcards', content: buildNoteMarkdown() })
                });
                if (res.status === 409) { showStatus('Name already exists'); return; }
                if (!res.ok) { const e = await res.json().catch(() => ({})); showStatus('Save failed: ' + (e.error || res.status)); return; }
                const data = await res.json();
                // Reload in edit mode so subsequent saves are PUTs against the created note.
                window.location.href = `/flashcards?note=${encodeURIComponent(data.ref || data.name || name)}`;
            } catch (e) {
                showStatus('Save error: ' + e.message);
            }
        }

        // ── Deck loading & boot ───────────────────────────────────────────
        async function loadDeck(name) {
            showStatus('Loading…');
            try {
                const res = await fetch(artifactContentUrl(name));
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                currentArtifactRevision = data.revision || null;
                const parsed = parseNoteMarkdown(data.content || '');
                if (parsed) {
                    flashcardSystem.cards = Array.isArray(parsed.cards) ? parsed.cards : [];
                    if (parsed.studyStats) flashcardSystem.studyStats = parsed.studyStats;
                }
                showStatus('');
            } catch (e) {
                showStatus('Load error: ' + e.message);
            }
        }

        function applyPlayMode() {
            // A clean study session: hide editor chrome, jump straight to Study.
            document.querySelector('.nav-tabs').style.display = 'none';
            document.getElementById('save-btn').style.display = 'none';
            switchTab('study');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // Header state
            if (currentNoteName) {
                const lbl = document.getElementById('deck-name-label');
                lbl.textContent = '📇 ' + currentNoteName;
                lbl.style.display = '';
                document.title = `Flashcards — ${currentNoteName}`;
            } else {
                document.getElementById('deck-name-input').style.display = '';
            }

            if (currentNoteName) {
                await loadDeck(currentNoteName);
            }

            refreshStats();
            updateCategoryFilter();

            if (PLAY_MODE) applyPlayMode();
        });

        // Click handler for flashcard flipping
        document.getElementById('current-flashcard').addEventListener('click', () => {
            if (!flashcardSystem.isCardFlipped) {
                flipCard();
            }
        });
    </script>
</body>
</html>
