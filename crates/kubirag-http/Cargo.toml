[package]
name = "kubirag-http"
version = "0.1.0"
description = "Adattatore HTTP di KubiRAG (axum): le route usate dalla SPA, con le stesse risposte del server Javalin, e il frontend incorporato nel binario."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kubi-kernel = { workspace = true, features = ["fs"] }
kubirag-domain.workspace = true
kubirag-app.workspace = true
kubirag-store-json.workspace = true
kubirag-llm.workspace = true
kubirag-workspace.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "multipart", "tokio", "original-uri"] }
tokio.workspace = true
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
include_dir = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
