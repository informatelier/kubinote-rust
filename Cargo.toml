[workspace]
resolver = "2"
members = [
    "crates/kubirag-domain",
    "crates/kubirag-app",
    "crates/kubirag-store-json",
    "crates/kubirag-retrieval",
    "crates/kubirag-llm",
    "crates/kubirag-workspace",
    "crates/kubirag-http",
    "crates/kubirag-cli",
    "crates/kubirag-acceptance",
]
# Checkout di dipendenze private fatto dalla CI (vedi .github/workflows/ci.yml).
exclude = [".deps"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/informatelier/kubinote-rust"

[workspace.dependencies]
# Shared Kernel: seconda implementazione di kubicommons. Finché la PR F0 di kubicommons-rust
# non è su main, la dipendenza punta al suo branch. Per lavorare con un checkout locale:
#   [patch."https://github.com/informatelier/kubicommons-rust"]
#   kubi-kernel = { path = "../kubicommons-rust/crates/kubi-kernel" }
kubi-kernel = { git = "https://github.com/informatelier/kubicommons-rust", branch = "main", default-features = false }
kubirag-domain = { path = "crates/kubirag-domain" }
kubirag-app = { path = "crates/kubirag-app" }
kubirag-store-json = { path = "crates/kubirag-store-json" }
kubirag-retrieval = { path = "crates/kubirag-retrieval" }
kubirag-llm = { path = "crates/kubirag-llm" }
kubirag-workspace = { path = "crates/kubirag-workspace" }
kubirag-http = { path = "crates/kubirag-http" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
tempfile = "3"
regex = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "signal"] }
proptest = "1"

# O3-KR2: binario sotto i 50 MB senza voce; i simboli non servono a chi lo usa.
[profile.release]
strip = "symbols"
